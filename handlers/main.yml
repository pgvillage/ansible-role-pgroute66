---
# Restarts are rolling: one host at a time, waiting until the pgroute66 API
# answers again before going on to the next host. A handler runs on all
# notified hosts at once, so the notified hosts first mark themselves, and then
# one run (run_once) restarts the marked hosts in turn (delegate_to), see
# tasks/restart_host.yml.
- name: Restart pgroute66
  ansible.builtin.set_fact:
    _pgroute66_restart_needed: true

- name: Restart pgroute66 on one host at a time
  ansible.builtin.include_tasks: restart_host.yml
  run_once: true
  loop: "{{ ansible_play_batch | select('in', _pgroute66_restart_hosts) | list }}"
  loop_control:
    loop_var: pgroute66_restart_host
  vars:
    _pgroute66_restart_hosts: >-
      {{ hostvars | dict2items | selectattr('value._pgroute66_restart_needed', 'defined')
         | selectattr('value._pgroute66_restart_needed') | map(attribute='key') | list }}
  listen: Restart pgroute66

- name: Restore the SELinux label of the check scripts
  ansible.builtin.command: restorecon -R "{{ pgroute66_scriptdir }}"
  changed_when: true
