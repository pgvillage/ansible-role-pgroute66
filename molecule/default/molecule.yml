---
# Tests the role on Rocky Linux 9 and 10 in systemd containers, with pgroute66
# from the pgvillage package repo, watching a local PostgreSQL server from the
# distribution (see prepare.yml). Each container is the only PostgreSQL node
# in its own pgroute66_pgnodes_group.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  - name: pgroute66-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - pgnodes_el9
  - name: pgroute66-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - pgnodes_el10
provisioner:
  name: ansible
  config_options:
    defaults:
      # The role's defaults use {% do %}, as does pgvillage's ansible.cfg
      jinja2_extensions: jinja2.ext.do
  inventory:
    host_vars:
      pgroute66-el9:
        pgroute66_pgnodes_group: pgnodes_el9
      pgroute66-el10:
        pgroute66_pgnodes_group: pgnodes_el10
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
