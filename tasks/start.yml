---

# Restarted (one host at a time) by the "Restart pgroute66" handler when the
# package, unit, config or certificates change
- name: "Start pgroute66 service"
  become: true
  ansible.builtin.systemd:
    name: pgroute66.service
    state: started
    enabled: "true"
    daemon_reload: "true"

# The package is usually upgraded outside this role (e.g. by the linux role or
# unattended-upgrades), and needrestart skips pgroute66.service. pgroute66
# still runs the old binary when the binary was replaced (its ctime) after the
# service started: restart it then (rolling, see handlers/main.yml). (Reading
# /proc/<pid>/exe would need CAP_SYS_PTRACE, which containers lack.)
- name: Find out if pgroute66 started before its binary was replaced
  ansible.builtin.shell: |
    set -e
    # Start time in microseconds of CLOCK_MONOTONIC (time since boot), 0 if not running
    started=$(systemctl show --property ExecMainStartTimestampMonotonic --value pgroute66.service)
    if [ "$(systemctl show --property MainPID --value pgroute66.service)" -gt 0 ] && [ "${started:-0}" -gt 0 ]; then
      uptime=$(cut -d. -f1 /proc/uptime)
      started_at=$(( $(date +%s) - uptime + started / 1000000 ))
      replaced_at=$(stat -c %Z '{{ pgroute66_deploydir }}/pgroute66')
      if [ "$replaced_at" -gt "$started_at" ]; then echo replaced; fi
    fi
  register: pgroute66_binary_check
  changed_when: pgroute66_binary_check.stdout == 'replaced'
  check_mode: false
  notify: Restart pgroute66
